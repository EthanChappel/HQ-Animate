[project]
name = "hq-animate"
version = "0.10.1"
description = "Create high quality APNG and WebP animations from a sequence of images."
authors = [{ name = "Ethan Chappel", email = "EthanChappel@users.noreply.github.com" }]
requires-python = ">=3.15,<3.16"
license = "MIT"
dependencies = [
    "pillow>=13.0.0,<14",
    "numpy>=2.5.4,<3",
    "astropy>=8.0.2,<9",
    "pyside6-essentials>=6.12.0,<7",
    "platformdirs>=4.14.3,<5",
]

[project.gui-scripts]
hq-animate = "hq_animate.__main__:main"

[dependency-groups]
dev = [
    "cx_freeze>=8.5.3,<9",
    "pip-licenses>=5.5.1,<6",
]

[tool.uv]
default-groups = "all"

[tool.uv.build-backend]
module-name = ["hq_animate"]
module-root = ""
namespace = true

[build-system]
requires = ["uv-build>=0.13.7"]
build-backend = "uv_build"
